<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><meta name="apple-mobile-web-app-capable" content="yes"><title>Print Profit v1.7</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color:#20242a;background:#fff;font-size:14px}*{box-sizing:border-box}body{margin:0;padding:12px}main{max-width:520px;margin:0 auto;border:1px solid #dce0e5;border-radius:16px;padding:14px;display:grid;gap:12px}header,.row{display:flex;align-items:center;justify-content:space-between;gap:8px}header strong{font-size:19px}header small,.hint{color:#737b86}.field{display:grid;gap:5px;min-width:0}label{font-size:13px;font-weight:600}.three,.two{display:grid;gap:8px}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.two{grid-template-columns:repeat(2,minmax(0,1fr))}input{width:100%;min-width:0;height:44px;border:1px solid #d1d7df;border-radius:9px;padding:0 10px;font:inherit;font-size:16px;background:#fff;color:#20242a}input:focus{outline:2px solid #8bb5f8;outline-offset:0}.switch{display:grid;grid-template-columns:1fr 1fr;border:1px solid #d1d7df;border-radius:10px;background:#f0f2f5;padding:3px;gap:3px}.switch button{background:transparent;color:#414851;border:0;border-radius:8px;min-height:38px;font-size:13px;font-weight:600}.switch button.active{background:#fff;color:#1f2328;box-shadow:0 1px 3px #0002}.fixed{height:48px;display:flex;align-items:center}.fixed input{height:48px}.result{height:48px;width:100%;display:flex;align-items:center;background:#f2f4f6;border-radius:9px;padding:10px;font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden}.rate{font-weight:700;font-size:13px;font-variant-numeric:tabular-nums}.range{width:100%;accent-color:#2679d9}.summary{background:#f2f4f6;border-radius:11px;padding:12px}.summary .cell{min-width:0}.summary .cell span{display:block;font-size:11px;color:#68717c;margin-bottom:5px}.summary .cell strong{display:block;font-size:13px;white-space:nowrap;letter-spacing:-.4px}.positive{color:#178047}.negative{color:#c62828}.confirmation{height:18px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#c62828}.actions{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}button{cursor:pointer;font-family:inherit}button.action{height:43px;border-radius:9px;padding:0 12px;font-weight:600;font-size:14px;white-space:nowrap}button.primary{background:#222a33;color:white;border:1px solid #222a33}button.outline{background:#fff;color:#333c46;border:1px solid #cbd2da}button.danger{background:#c62828;color:white;border:1px solid #c62828}button:disabled{opacity:.4;cursor:default}.hint{font-size:11px;line-height:1.5;margin:0}@media(max-width:360px){main{padding:10px;gap:10px}.summary .cell strong{font-size:11px}.switch button{font-size:12px}}
</style>
</head>
<body><main>
<header><strong>▣ Print Profit</strong><small>v1.7</small></header>
<div class="field"><label for="name">商品名</label><input id="name" value="キーホルダー" placeholder="例：ネコのキーホルダー"></div>
<div class="three"><div class="field"><label for="fp">材料価格 ¥</label><input id="fp" type="number" inputmode="decimal" value="2500" placeholder="例：2500"></div><div class="field"><label for="fw">材料重量 g</label><input id="fw" type="number" inputmode="decimal" value="1000" placeholder="例：1000"></div><div class="field"><label for="iw">作品重量 g</label><input id="iw" type="number" inputmode="decimal" value="20" placeholder="例：20"></div></div>
<div class="switch"><button id="priceMode" class="active" type="button">価格 → 利益率</button><button id="marginMode" type="button">利益率 → 価格</button></div>
<div class="two"><div class="field"><div class="row"><label id="inputLabel">販売価格（円）</label><span class="rate" id="rateLabel"></span></div><div class="fixed"><input id="price" type="number" inputmode="decimal" value="200" placeholder="例：200"><input id="target" class="range" type="range" min="5" max="95" step="1" value="75" style="display:none"></div></div><div class="field"><label id="outputLabel">利益率</label><div class="result" id="output">—</div></div></div>
<div class="summary three"><div class="cell"><span>原価</span><strong id="cost">—</strong></div><div class="cell"><span>販売価格</span><strong id="sale">—</strong></div><div class="cell"><span>差引利益</span><strong id="profit">—</strong></div></div>
<div><div class="confirmation" id="confirmation"></div><div class="actions"><button type="button" class="action primary" id="copy">▢ 結果をコピー</button><button type="button" class="action outline" id="clear">⌫ 全クリア</button></div></div>
<p class="hint">※ フィラメント代のみで計算。電気代・その他経費は含みません。</p>
</main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);let mode='price',confirmClear=false,latest=null;const yen=v=>new Intl.NumberFormat('ja-JP',{maximumFractionDigits:2}).format(v)+'円';const numberValid=(v,positive=false)=>v.trim()!==''&&Number.isFinite(Number(v))&&(positive?Number(v)>0:Number(v)>=0);function render(){const fp=$('fp').value,fw=$('fw').value,iw=$('iw').value,price=$('price').value,target=Number($('target').value);const valid=numberValid(fp)&&numberValid(fw,true)&&numberValid(iw);const cost=valid?Number(fp)/Number(fw)*Number(iw):0;const sale=mode==='margin'?Math.ceil(cost/(1-target/100)):Number(price);const ok=valid&&(mode==='margin'?sale>0:numberValid(price,true));const profit=sale-cost,margin=sale>0?profit/sale*100:0;latest=ok?{cost,sale,profit,margin}:null;$('output').textContent=ok?(mode==='price'?margin.toFixed(1)+'%':yen(sale)):'—';$('cost').textContent=ok?yen(cost):'—';$('sale').textContent=ok?yen(sale):'—';$('profit').textContent=ok?yen(profit):'—';$('profit').className=ok?(profit>=0?'positive':'negative'):'';$('copy').disabled=!ok;$('rateLabel').textContent=mode==='margin'?target+'%':'';$('confirmation').textContent=confirmClear?'入力内容をすべて消去しますか？':'';$('clear').textContent=confirmClear?'クリアする':'⌫ 全クリア';$('clear').className='action '+(confirmClear?'danger':'outline');$('copy').textContent=confirmClear?'キャンセル':'▢ 結果をコピー';$('copy').className='action '+(confirmClear?'outline':'primary');$('copy').disabled=!confirmClear&&!ok}function switchMode(next){mode=next;$('priceMode').classList.toggle('active',mode==='price');$('marginMode').classList.toggle('active',mode==='margin');$('price').style.display=mode==='price'?'':'none';$('target').style.display=mode==='margin'?'':'none';$('inputLabel').textContent=mode==='price'?'販売価格（円）':'目標利益率';$('outputLabel').textContent=mode==='price'?'利益率':'必要販売価格';render()}['name','fp','fw','iw','price','target'].forEach(id=>$(id).addEventListener('input',render));$('priceMode').addEventListener('click',()=>switchMode('price'));$('marginMode').addEventListener('click',()=>switchMode('margin'));$('clear').addEventListener('click',()=>{if(!confirmClear){confirmClear=true;render();return}['name','fp','fw','iw','price'].forEach(id=>$(id).value='');$('target').value='75';confirmClear=false;switchMode('price')});$('copy').addEventListener('click',async()=>{if(confirmClear){confirmClear=false;render();return}if(!latest)return;const {cost,sale,profit,margin}=latest;const text=`【${$('name').value.trim()||'商品名未設定'}】\nフィラメント価格：${yen(Number($('fp').value))}／${$('fw').value}g\n作品重量：${$('iw').value}g\n原価：${yen(cost)}\n販売価格：${yen(sale)}\n材料費差引後の利益：${yen(profit)}\n材料費ベースの利益率：${margin.toFixed(1)}%`;try{await navigator.clipboard.writeText(text);const b=$('copy');b.textContent='コピーしました';setTimeout(render,1300)}catch(e){const area=document.createElement('textarea');area.value=text;area.style.position='fixed';area.style.opacity='0';document.body.appendChild(area);area.select();let success=false;try{success=document.execCommand('copy')}catch(_){}area.remove();if(success){$('copy').textContent='コピーしました';setTimeout(render,1300)}else alert('コピーできませんでした。Safariで開いて再度お試しください。')}});render()})();
</script></body></html>
